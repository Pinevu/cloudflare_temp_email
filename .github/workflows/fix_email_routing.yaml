name: Fix Email Routing
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose & fix Email Routing for 5i.wiki
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          TOK="$CLOUDFLARE_API_TOKEN"
          ZID=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=5i.wiki" -H "Authorization: Bearer $TOK" | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])")
          echo "zone_id=$ZID"
          echo "--- email routing status ---"
          curl -sS "https://api.cloudflare.com/client/v4/zones/$ZID/email/routing" -H "Authorization: Bearer $TOK"
          echo
          echo "--- enable email routing ---"
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZID/email/routing/enable" -H "Authorization: Bearer $TOK"
          echo
          echo "--- existing rules ---"
          curl -sS "https://api.cloudflare.com/client/v4/zones/$ZID/email/routing/rules" -H "Authorization: Bearer $TOK" > /tmp/rules.json
          cat /tmp/rules.json | head -c 2000
          echo
          echo "--- workers with email handler ---"
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts?per_page=50" -H "Authorization: Bearer $TOK" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(s['id'],'handlers=',s.get('handlers')) for s in d.get('result',[])]"
          echo "--- delete old catch-all rules ---"
          python3 -c 'import json;d=json.load(open("/tmp/rules.json"));[print(r["id"]) for r in d.get("result",[]) if any(m.get("type")=="all" for m in r.get("matchers",[]))]' > /tmp/oldids.txt
          while read -r rid; do
            echo "deleting $rid"
            curl -sS -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZID/email/routing/rules/$rid" -H "Authorization: Bearer $TOK"
            echo
          done < /tmp/oldids.txt
          echo "--- create catch-all -> cloudflare_temp_email ---"
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZID/email/routing/rules" \
            -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" \
            -d '{"matchers":[{"type":"all"}],"actions":[{"type":"send_to_worker","value":["cloudflare_temp_email"]}],"enabled":true}'
          echo
          echo "--- verify ---"
          curl -sS "https://api.cloudflare.com/client/v4/zones/$ZID/email/routing/rules" -H "Authorization: Bearer $TOK"
          echo
