name: Deploy TempMail Undp Pages

on:
  workflow_dispatch:
  push:
    paths:
      - "undp-inbox/**"
      - ".github/workflows/deploy-tempmail-undp.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./undp-inbox --project-name=tempmail-undp --branch=main
