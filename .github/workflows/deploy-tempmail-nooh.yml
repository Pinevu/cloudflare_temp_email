name: Deploy TempMail Nooh Pages

on:
  workflow_dispatch:
  push:
    paths:
      - "nooh-inbox/**"
      - ".github/workflows/deploy-tempmail-nooh.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./nooh-inbox --project-name=tempmail-nooh --branch=main
